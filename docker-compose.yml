# Run the whole boutique stack locally with Docker.
#   1. cp .env.example .env   (then fill in your keys)
#   2. docker compose up -d
#   3. open http://localhost:5678
# Workflows in ./n8n are mounted read-only at /workflows for CLI import.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: boutique-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Africa/Johannesburg
      - TZ=Africa/Johannesburg
      # Allow login over plain http on localhost.
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
      # If you expose webhooks via a tunnel, set WEBHOOK_URL in .env to the
      # public https URL (e.g. https://abc123.ngrok-free.app/).
      - WEBHOOK_URL=${WEBHOOK_URL:-}
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  n8n_data:
